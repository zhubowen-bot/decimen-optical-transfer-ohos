    <style rel="stylesheet" crossorigin>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;min-height:100vh}
h1{font-size:16px;font-weight:700;color:var(--text);margin:0;text-align:center}
h1 small{color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:13px;text-align:center;max-width:640px}
a{color:var(--text);text-decoration:none}
a:hover,a:focus-visible{color:var(--accent);text-decoration:underline}
button{font:inherit;color:var(--text);background:#fff;border:0;border-radius:16px;padding:14px 32px;font-size:16px;font-weight:600;cursor:pointer;transition:background-color .15s ease,box-shadow .15s ease;box-shadow:0 1px 4px rgba(28,27,24,.08),0 4px 12px rgba(28,27,24,.05)}
button:hover{background:#f7f7f7;box-shadow:0 2px 8px rgba(28,27,24,.1),0 8px 20px rgba(28,27,24,.07)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.file-picker{position:relative;width:min(92vw,640px);display:flex;align-items:center;gap:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05)}
.file-picker:hover{border-color:var(--line-bright)}
.file-picker-button{flex:none;color:var(--text);background:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:600;transition:background-color .15s ease,box-shadow .15s ease,color .15s ease;box-shadow:0 1px 4px rgba(28,27,24,.08),0 4px 12px rgba(28,27,24,.05)}
.file-picker:hover .file-picker-button{background:#f7f7f7}
.file-picker.has-file .file-picker-button{color:var(--red);background:transparent;border-color:var(--red)}
.file-picker.has-file:hover .file-picker-button{background:rgba(var(--red-rgb),.06)}
.file-picker-text{min-width:0;overflow-wrap:anywhere;color:var(--text-dim);font-weight:500}
.file-picker input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-picker:has(input:focus-visible) .file-picker-button{outline:2px solid var(--accent);outline-offset:2px}
.stage{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:22px;cursor:zoom-in;box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.25)}
body.qr-full{padding:0;gap:0}
body.qr-full :is(.site-header,.site-footer),body.qr-full .send-shell>:not(#stage){display:none}
body.qr-full .send-shell{width:100%;margin:0;padding:0}
body.qr-full #stage{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;margin:0;padding:0;border-radius:0;cursor:zoom-out}

  <body class="tool-page">
    <header class="site-header">
      <span class="brand"><img class="brand-logo" src="startIcon.png" alt="" />LiveQRTransfer</span>

    <main class="send-shell">
      <section class="tool-intro">

            <select id="cfg-fps"><option>10</option><option>15</option><option>20</option><option>24</option><option>30</option><option>55</option><option selected>60</option></select>

    </main>
    <script>
      (function () {
        var picker = document.getElementById('mode-picker');
        if (!picker) return;
        var indicator = document.getElementById('mode-indicator');
        var inputs = picker.querySelectorAll('input[name="send-mode"]');
        var labels = picker.querySelectorAll('label');
        var first = true;
        function targetLeft() {
          var checked = picker.querySelector('input:checked');
          return (!!checked && checked.value === 'snippet') ? 'calc(50% - 1px)' : '4px';
        }
        function sync() {
          var checked = picker.querySelector('input:checked');
          var snippet = !!checked && checked.value === 'snippet';
          picker.classList.toggle('snippet', snippet);
          if (!indicator) return;
          var to = targetLeft();
          if (first) {
            indicator.style.left = to;
            first = false;
            return;
          }
          if (indicator.animate) {
            var from = getComputedStyle(indicator).left;
            indicator.animate([{ left: from }, { left: to }], { duration: 280, easing: 'ease' });
            indicator.style.left = to;
          } else {
            indicator.style.left = to;
          }
        }
        for (var i = 0; i < inputs.length; i++) {
          inputs[i].addEventListener('change', sync);
          inputs[i].addEventListener('input', sync);
        }
        for (var j = 0; j < labels.length; j++) {
          labels[j].addEventListener('click', function () { setTimeout(sync, 0); });
        }
        sync();
      })();
    </script>
  <script>
window.__playEntrance = function () {
  var items = document.querySelectorAll('body > header, body > footer, body > .topbar, main > *, .about-shell > *');
  var list = [];
  for (var i = 0; i < items.length; i++) {
    var el = items[i];
    if (el.hidden) continue;
    var r = el.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    list.push(el);
  }
  var cx = window.innerWidth / 2;
  var cy = window.innerHeight / 2;
  for (var j = 0; j < list.length; j++) {
    (function (el, index) {
      var rect = el.getBoundingClientRect();
      var ex = rect.left + rect.width / 2;
      var ey = rect.top + rect.height / 2;
      var dx = cx - ex;
      var dy = cy - ey;
      if (el.getAnimations) {
        el.getAnimations().forEach(function (a) { a.cancel(); });
      }
      if (el.animate) {
        el.animate([
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.5)', opacity: 0, offset: 0 },
          { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 1 }
        ], { duration: 800, delay: index * 35, easing: 'cubic-bezier(.25,.1,.25,1)', fill: 'both' });
      } else {
        el.style.opacity = '1';
      }
    })(list[j], j);
  }
};
</script>
